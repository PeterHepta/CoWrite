<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CoWrite</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link href="https://unpkg.com/quill-emoji/dist/quill-emoji.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
        :root {
            --matcha-bg: #f0f4ee;
            --matcha-surface: #f7f9f5;
            --matcha-card: #ffffff;
            --matcha-border: #dde8d8;
            --matcha-border-light: #e8f0e4;
            --matcha-accent: #5a7a4a;
            --matcha-accent-hover: #4a6a3a;
            --matcha-accent-light: #eaf2e5;
            --matcha-text: #2c3a28;
            --matcha-text-secondary: #6b7f64;
            --matcha-text-muted: #9aaa94;
            --matcha-green: #4a8c5c;
            --matcha-green-light: #e4f2e8;
            --matcha-yellow: #8a7a2a;
            --matcha-yellow-light: #f5f0dc;
        }
        body { font-family: 'Inter', 'Noto Serif SC', 'Source Han Serif SC', 'Source Han Serif CN', serif; padding: 20px; background: var(--matcha-bg); margin: 0; color: var(--matcha-text); }
        .main-container { display: flex; flex-direction: column; height: 92vh; max-width: 1000px; margin: 0 auto; gap: 10px; }
        .panel { background: var(--matcha-card); border-radius: 8px; box-shadow: 0 1px 4px rgba(60,80,50,0.08); }
        .status-header {
            display: flex; align-items: stretch; gap: 0;
            padding: 0; overflow: visible;
            border-bottom: none; margin-bottom: 0;
            border-radius: 8px;
        }
        .status-section {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px;
        }
        .status-section + .status-section {
            border-left: 1px solid var(--matcha-border-light);
        }
        .status-section-brand { min-width: 90px; }
        .status-section-brand .brand-name {
            font-size: 15px; font-weight: 700; color: var(--matcha-text); letter-spacing: -0.2px;
        }
        .status-section-doc { flex: 1; min-width: 0; }
        .status-section-doc #doc-display {
            max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle;
        }
        .status-section-user { gap: 6px; flex-shrink: 0; }
        .status-section-user #site-display {
            max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .status-pill {
            display: inline-flex; align-items: center; gap: 4px;
            background: var(--matcha-surface); border-radius: 20px;
            padding: 3px 10px; font-size: 12px; color: var(--matcha-text-secondary); white-space: nowrap;
        }
        .status-pill.online { background: var(--matcha-green-light); color: var(--matcha-green); }
        .status-pill.waiting { background: var(--matcha-yellow-light); color: var(--matcha-yellow); }

        /* 编辑器+图形层容器 */
        #editor-wrap {
            flex: 1; position: relative; display: flex; flex-direction: column;
            border: 1px solid var(--matcha-border); border-radius: 0 0 8px 8px; background: var(--matcha-card);
            overflow: hidden;
        }
        #editor-container {
            flex: 1; font-size: 16px; background: var(--matcha-card);
            border: none !important; border-radius: 0 !important;
            overflow: hidden;
        }
        /* shape-canvas 仅在放置模式显示，平时隐藏且不拦截事件 */
        #shape-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        #shape-canvas.placing { display: block; pointer-events: all; cursor: crosshair; }
        /* 图形工具栏 */
        #shape-toolbar {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            background: var(--matcha-surface);
            border-bottom: 1px solid var(--matcha-border-light);
            flex-shrink: 0;
        }
        #shape-toolbar .stb-label {
            font-size: 12px; color: var(--matcha-text-muted); white-space: nowrap;
        }
        .shape-btn {
            width: 32px; height: 32px;
            border: 1.5px solid var(--matcha-border); border-radius: 6px;
            background: var(--matcha-card); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: border-color .15s, background .15s;
            padding: 0; flex-shrink: 0;
        }
        .shape-btn:hover { border-color: var(--matcha-accent); background: var(--matcha-accent-light); }
        .shape-btn.active { border-color: var(--matcha-accent); background: var(--matcha-accent-light); }
        .shape-btn svg { width: 18px; height: 18px; }
        .stb-sep { width: 1px; height: 20px; background: var(--matcha-border-light); margin: 0 2px; }

        /* 图形 DOM 元素：放在 editor-wrap 内，绝对定位 */
        .shape-el {
            position: absolute;
            cursor: grab;
            z-index: 5;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            pointer-events: all;
        }
        .shape-el.selected { outline: 2px dashed var(--matcha-accent); outline-offset: 1px; }
        .shape-el canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
        /* 缩放把手 */
        .shape-handle {
            position: absolute;
            width: 10px; height: 10px;
            background: white; border: 2px solid var(--matcha-accent);
            border-radius: 2px;
            cursor: nwse-resize; z-index: 20;
            pointer-events: all;
            display: none;
        }
        .shape-el.selected .shape-handle { display: block; }
        .shape-handle.tl { top: -5px; left: -5px; cursor: nwse-resize; }
        .shape-handle.tr { top: -5px; right: -5px; cursor: nesw-resize; }
        .shape-handle.bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .shape-handle.br { bottom: -5px; right: -5px; cursor: nwse-resize; }

        .ql-toolbar.ql-snow { border-radius: 8px 8px 0 0; border: 1px solid var(--matcha-border); background: var(--matcha-surface); border-bottom: none; }
        .ql-toolbar.ql-snow .ql-formats { margin-right: 12px; vertical-align: middle; }
        .ql-toolbar.ql-snow button, .ql-toolbar.ql-snow .ql-picker { font-family: 'Inter', 'Noto Serif SC', serif; }
        .ql-editor { font-family: 'Inter', 'Noto Serif SC', 'Source Han Serif SC', 'Source Han Serif CN', serif !important; font-size: 16px; }
        .ql-editor.ql-blank::before { font-family: 'Inter', 'Noto Serif SC', serif; font-style: normal; color: var(--matcha-text-muted); }
        #log { display: none; }

        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--matcha-bg);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .auth-page {
            width: 380px;
            display: flex; flex-direction: column; align-items: center; gap: 0;
        }
        .auth-logo { margin-bottom: 32px; text-align: center; }
        .auth-logo .logo-icon {
            width: 52px; height: 52px; background: var(--matcha-accent); border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px auto;
            box-shadow: 0 4px 16px rgba(90,122,74,0.3);
        }
        .auth-logo .logo-icon svg { width: 28px; height: 28px; fill: white; }
        .auth-logo h1 { font-size: 22px; font-weight: 700; color: var(--matcha-text); margin: 0 0 4px 0; letter-spacing: -0.3px; }
        .auth-logo p { font-size: 13px; color: var(--matcha-text-muted); margin: 0; }
        .auth-card {
            background: var(--matcha-card); border-radius: 16px; box-shadow: 0 2px 20px rgba(60,80,50,0.1);
            width: 100%; overflow: hidden;
        }
        .auth-tabs { display: flex; border-bottom: 1px solid var(--matcha-border-light); }
        .auth-tab {
            flex: 1; padding: 16px; text-align: center; font-size: 14px; font-weight: 600;
            color: var(--matcha-text-muted); cursor: pointer; border: none; background: none;
            border-bottom: 2px solid transparent; margin-bottom: -1px;
            transition: color 0.2s, border-color 0.2s;
        }
        .auth-tab.active { color: var(--matcha-accent); border-bottom-color: var(--matcha-accent); }
        .auth-form { padding: 28px; display: flex; flex-direction: column; gap: 14px; }
        .auth-form input {
            padding: 13px 14px; border: 1.5px solid var(--matcha-border); border-radius: 10px;
            font-size: 15px; outline: none; background: var(--matcha-surface); transition: border-color 0.2s, background 0.2s;
            color: var(--matcha-text); font-family: inherit;
        }
        .auth-form input:focus { border-color: var(--matcha-accent); background: white; }
        .auth-form input::placeholder { color: var(--matcha-text-muted); }
        .auth-submit {
            padding: 14px; border: none; border-radius: 10px; font-size: 15px;
            cursor: pointer; font-weight: 600; transition: opacity 0.2s, transform 0.15s;
            background: var(--matcha-accent); color: white; margin-top: 4px; font-family: inherit;
        }
        .auth-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .auth-submit:active { transform: translateY(0); }

        #btn-logout {
            background: none; color: #c0483a; border: 1px solid #c0483a; border-radius: 6px;
            padding: 4px 10px; font-size: 12px; cursor: pointer; display: none; font-family: inherit;
        }
        #btn-logout:hover { background: #c0483a; color: white; }
        .action-btn {
            background: none; border: 1px solid var(--matcha-border); border-radius: 6px;
            padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--matcha-text-secondary); white-space: nowrap;
            display: none; align-items: center; gap: 4px; font-family: inherit;
        }
        .action-btn:hover { background: var(--matcha-accent-light); }
        .action-btn.orange { border-color: #b08a2a; color: #b08a2a; }
        .action-btn.orange:hover { background: #b08a2a; color: white; }
        .action-btn.blue { border-color: var(--matcha-accent); color: var(--matcha-accent); }
        .action-btn.blue:hover { background: var(--matcha-accent); color: white; }

        .flow-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--matcha-bg);
            display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .flow-page { width: 380px; display: flex; flex-direction: column; align-items: center; }
        .flow-header { margin-bottom: 28px; text-align: center; }
        .flow-header h2 { font-size: 20px; font-weight: 700; color: var(--matcha-text); margin: 0 0 4px 0; letter-spacing: -0.3px; }
        .flow-header p { font-size: 13px; color: var(--matcha-text-muted); margin: 0; }
        .flow-card {
            background: var(--matcha-card); border-radius: 16px; box-shadow: 0 2px 20px rgba(60,80,50,0.1);
            width: 100%; padding: 24px; display: flex; flex-direction: column; gap: 10px;
        }
        .flow-card input {
            padding: 13px 14px; border: 1.5px solid var(--matcha-border); border-radius: 10px;
            font-size: 15px; outline: none; background: var(--matcha-surface); transition: border-color 0.2s, background 0.2s;
            color: var(--matcha-text); width: 100%; box-sizing: border-box; font-family: inherit;
        }
        .flow-card input:focus { border-color: var(--matcha-accent); background: white; }
        .flow-card input::placeholder { color: var(--matcha-text-muted); }
        .flow-btn {
            padding: 13px 14px; border: none; border-radius: 10px; font-size: 15px;
            cursor: pointer; font-weight: 600; transition: opacity 0.2s, transform 0.15s;
            width: 100%; text-align: center; font-family: inherit;
        }
        .flow-btn:hover { opacity: 0.88; transform: translateY(-1px); }
        .flow-btn:active { transform: translateY(0); }
        .flow-btn-primary { background: var(--matcha-accent); color: white; }
        .flow-btn-green { background: var(--matcha-green); color: white; }
        .flow-btn-secondary { background: var(--matcha-surface); color: var(--matcha-text-secondary); border: 1px solid var(--matcha-border); }
        .flow-btn-secondary:hover { background: var(--matcha-accent-light); opacity: 1; }
        .flow-divider { height: 1px; background: var(--matcha-border-light); margin: 4px 0; }
        .flow-hint { font-size: 13px; color: var(--matcha-text-muted); text-align: center; margin: 0; }

        #invite-code-display, #gen-invite-code-display {
            font-size: 30px; letter-spacing: 8px; color: var(--matcha-accent);
            font-family: 'SF Mono', 'Fira Code', monospace; font-weight: 700;
            background: var(--matcha-accent-light); padding: 14px 20px; border-radius: 12px;
            text-align: center; border: 1.5px solid var(--matcha-border);
        }
        #input-invite-code {
            font-size: 22px; font-family: 'SF Mono', 'Fira Code', monospace; letter-spacing: 6px;
            text-align: center; text-transform: uppercase;
        }
        #timed-options select {
            width: 100%; padding: 12px 14px; border: 1.5px solid var(--matcha-border); border-radius: 10px;
            font-size: 14px; outline: none; background: var(--matcha-surface); color: var(--matcha-text);
            appearance: none; cursor: pointer; font-family: inherit;
        }
        #timed-options { display: flex; flex-direction: column; gap: 10px; }

        #ql-custom-placeholder {
            position: absolute; top: 0; left: 0;
            padding: 12px 15px;
            color: var(--matcha-text-muted); font-size: 16px;
            pointer-events: none; user-select: none;
        }
        .room-card {
            display: flex; flex-direction: column; gap: 4px;
            padding: 14px 16px; border: 1.5px solid var(--matcha-border); border-radius: 10px;
            cursor: pointer; background: var(--matcha-surface);
            transition: border-color .18s, background .18s;
        }
        .room-card:hover { border-color: var(--matcha-accent); background: var(--matcha-accent-light); }
        .room-card-name { font-size: 15px; font-weight: 600; color: var(--matcha-text); }
        .room-card-meta { font-size: 12px; color: var(--matcha-text-muted); display: flex; gap: 12px; flex-wrap: wrap; }

        #members-panel {
            position: fixed; top: auto; left: auto; margin-top: 4px;
            background: var(--matcha-card); border-radius: 10px; box-shadow: 0 4px 20px rgba(60,80,50,0.13);
            border: 1px solid var(--matcha-border); min-width: 220px; z-index: 1000;
            display: none; flex-direction: column; overflow: hidden;
        }
        #members-panel.open { display: flex; }
        .members-panel-header {
            padding: 10px 14px 8px; font-size: 12px; font-weight: 600;
            color: var(--matcha-text-muted); border-bottom: 1px solid var(--matcha-border-light); background: var(--matcha-surface);
        }
        .members-list { max-height: 220px; overflow-y: auto; padding: 6px 0; }
        .member-item {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 14px; font-size: 13px; color: var(--matcha-text);
        }
        .member-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .member-dot.in-room  { background: var(--matcha-green); }
        .member-dot.online   { background: var(--matcha-accent); }
        .member-dot.offline  { background: var(--matcha-text-muted); }
        .member-status-label { font-size: 11px; color: var(--matcha-text-muted); margin-left: auto; white-space: nowrap; }
        .member-owner-tag {
            font-size: 10px; color: #b08a2a; border: 1px solid #b08a2a;
            border-radius: 4px; padding: 0px 4px; vertical-align: middle; margin-left: 4px;
        }
        /* 图形工具提示 */
        #shape-hint {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            background: rgba(44,58,40,0.75); color: white; font-size: 12px;
            padding: 4px 12px; border-radius: 20px;
            pointer-events: none; z-index: 30;
            display: none; white-space: nowrap;
        }

        /* 存档下拉菜单 */
        .save-dropdown-wrap {
            position: relative; display: none; align-items: center;
        }
        .save-dropdown-wrap.visible { display: inline-flex; }
        #btn-save-menu {
            background: none; border: 1px solid var(--matcha-green); border-radius: 6px;
            padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--matcha-green);
            white-space: nowrap; display: flex; align-items: center; gap: 4px;
            transition: background .15s, color .15s; font-family: inherit;
        }
        #btn-save-menu:hover { background: var(--matcha-green); color: white; }
        .save-dropdown-menu {
            position: absolute; top: calc(100% + 6px); right: 0;
            background: var(--matcha-card); border-radius: 10px;
            box-shadow: 0 4px 20px rgba(60,80,50,0.13);
            border: 1px solid var(--matcha-border); min-width: 140px; z-index: 1000;
            display: none; flex-direction: column; overflow: hidden;
        }
        .save-dropdown-menu.open { display: flex; }
        .save-menu-item {
            padding: 10px 16px; font-size: 13px; color: var(--matcha-text); cursor: pointer;
            display: flex; align-items: center; gap: 8px; white-space: nowrap;
            transition: background .12s;
        }
        .save-menu-item:hover { background: var(--matcha-accent-light); }
        .save-menu-item + .save-menu-item { border-top: 1px solid var(--matcha-border-light); }

        /* 读取存档弹窗 */
        #load-save-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44,58,40,0.3); display: none;
            justify-content: center; align-items: center; z-index: 9000;
        }
        #load-save-overlay.open { display: flex; }
        .load-save-modal {
            background: var(--matcha-card); border-radius: 16px;
            box-shadow: 0 4px 30px rgba(60,80,50,0.18);
            width: 440px; max-width: 94vw; max-height: 80vh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .load-save-header {
            padding: 18px 20px 14px; border-bottom: 1px solid var(--matcha-border-light);
            display: flex; align-items: center; justify-content: space-between;
        }
        .load-save-header h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--matcha-text); }
        #btn-close-load-save {
            background: none; border: none; font-size: 20px; cursor: pointer;
            color: var(--matcha-text-muted); line-height: 1; padding: 0 4px;
        }
        #btn-close-load-save:hover { color: var(--matcha-text); }
        .load-save-list {
            flex: 1; overflow-y: auto; padding: 10px 12px; display: flex;
            flex-direction: column; gap: 8px;
        }
        .save-slot-card {
            padding: 12px 14px; border: 1.5px solid var(--matcha-border); border-radius: 10px;
            cursor: pointer; background: var(--matcha-surface);
            transition: border-color .15s, background .15s;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .save-slot-card:hover { border-color: var(--matcha-accent); background: var(--matcha-accent-light); }
        .save-slot-card.quick-save { border-color: #c09a30; background: var(--matcha-yellow-light); }
        .save-slot-card.quick-save:hover { background: #ede8c8; }
        .save-slot-info { flex: 1; min-width: 0; }
        .save-slot-name { font-size: 14px; font-weight: 600; color: var(--matcha-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .save-slot-meta { font-size: 11px; color: var(--matcha-text-muted); margin-top: 2px; }
        .save-slot-del {
            background: none; border: 1px solid #c0483a; color: #c0483a; border-radius: 5px;
            font-size: 11px; padding: 3px 7px; cursor: pointer; flex-shrink: 0;
            transition: background .12s, color .12s; font-family: inherit;
        }
        .save-slot-del:hover { background: #c0483a; color: white; }
        .load-save-empty { padding: 28px; text-align: center; color: var(--matcha-text-muted); font-size: 13px; }

        /* ── Toast 通知（右上角） ── */
        #toast-container {
            position: fixed; top: 16px; right: 16px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 99999; pointer-events: none;
        }
        .toast {
            display: flex; align-items: flex-start; gap: 10px;
            background: var(--matcha-card);
            border: 1px solid var(--matcha-border);
            border-left: 3px solid var(--matcha-accent);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(44,58,40,0.13);
            padding: 11px 14px;
            min-width: 220px; max-width: 320px;
            pointer-events: all;
            animation: toast-in .22s ease;
        }
        .toast.toast-error { border-left-color: #c0483a; }
        .toast.toast-warn  { border-left-color: #b08a2a; }
        .toast.toast-info  { border-left-color: var(--matcha-accent); }
        .toast.toast-success { border-left-color: var(--matcha-green); }
        .toast-icon { font-size: 15px; line-height: 1.4; flex-shrink: 0; }
        .toast-body { flex: 1; }
        .toast-msg { font-size: 13px; color: var(--matcha-text); line-height: 1.5; }
        .toast-close {
            background: none; border: none; cursor: pointer; padding: 0;
            color: var(--matcha-text-muted); font-size: 15px; line-height: 1;
            flex-shrink: 0; margin-top: 1px;
        }
        .toast-close:hover { color: var(--matcha-text); }
        .toast.toast-out { animation: toast-out .2s ease forwards; }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(24px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes toast-out {
            from { opacity: 1; transform: translateX(0); }
            to   { opacity: 0; transform: translateX(24px); }
        }

        /* ── 自定义 confirm / prompt 弹窗 ── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44,58,40,0.28);
            display: flex; justify-content: center; align-items: center;
            z-index: 99998;
            animation: modal-bg-in .15s ease;
        }
        @keyframes modal-bg-in { from { opacity:0; } to { opacity:1; } }
        .modal-box {
            background: var(--matcha-card); border-radius: 14px;
            box-shadow: 0 8px 32px rgba(44,58,40,0.18);
            border: 1px solid var(--matcha-border);
            width: 320px; max-width: 90vw;
            padding: 24px 22px 18px;
            display: flex; flex-direction: column; gap: 14px;
            animation: modal-in .18s ease;
        }
        @keyframes modal-in {
            from { opacity:0; transform: scale(.95) translateY(6px); }
            to   { opacity:1; transform: scale(1) translateY(0); }
        }
        .modal-msg {
            font-size: 14px; color: var(--matcha-text); line-height: 1.6; margin: 0;
        }
        .modal-input {
            padding: 11px 13px; border: 1.5px solid var(--matcha-border); border-radius: 9px;
            font-size: 14px; outline: none; background: var(--matcha-surface);
            color: var(--matcha-text); font-family: inherit; width: 100%; box-sizing: border-box;
            transition: border-color .18s;
        }
        .modal-input:focus { border-color: var(--matcha-accent); background: #fff; }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btn {
            padding: 8px 18px; border: none; border-radius: 8px; font-size: 13px;
            font-weight: 600; cursor: pointer; font-family: inherit;
            transition: opacity .15s, transform .12s;
        }
        .modal-btn:hover { opacity: .88; transform: translateY(-1px); }
        .modal-btn:active { transform: translateY(0); }
        .modal-btn-cancel { background: var(--matcha-surface); color: var(--matcha-text-secondary); border: 1px solid var(--matcha-border); }
        .modal-btn-cancel:hover { opacity:1; background: var(--matcha-accent-light); }
        .modal-btn-ok { background: var(--matcha-accent); color: white; }
        .modal-btn-ok.danger { background: #c0483a; }

        #ai-panel {
            position: fixed; top: 0; right: -420px; width: 400px; height: 100vh;
            background: var(--matcha-card); border-left: 1px solid var(--matcha-border);
            box-shadow: -4px 0 24px rgba(44,58,40,0.12);
            display: flex; flex-direction: column; z-index: 9500;
            transition: right .3s cubic-bezier(.4,0,.2,1);
        }
        #ai-panel.open { right: 0; }
        #ai-panel-header {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 16px; border-bottom: 1px solid var(--matcha-border-light);
            background: var(--matcha-surface); flex-shrink: 0;
        }
        #ai-panel-header h3 {
            margin: 0; flex: 1; font-size: 14px; font-weight: 700; color: var(--matcha-text);
        }
        #btn-close-ai {
            background: none; border: none; font-size: 18px; cursor: pointer;
            color: var(--matcha-text-muted); line-height: 1; padding: 2px 5px;
        }
        #btn-close-ai:hover { color: var(--matcha-text); }
        #ai-backend-badge {
            font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px;
            white-space: nowrap; letter-spacing: .3px;
        }
        #ai-backend-badge.webgpu { background: #e8f0ff; color: #3a5abf; border: 1px solid #b0c4f8; }
        #ai-backend-badge.wasm   { background: var(--matcha-accent-light); color: var(--matcha-accent); border: 1px solid var(--matcha-border); }
        #ai-panel-body {
            flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
        }
        #ai-model-bar {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        #ai-model-select {
            flex: 1; padding: 7px 10px; border: 1.5px solid var(--matcha-border); border-radius: 8px;
            font-size: 12px; background: var(--matcha-surface); color: var(--matcha-text);
            outline: none; font-family: inherit; cursor: pointer;
        }
        #ai-model-select:focus { border-color: var(--matcha-accent); }
        #ai-progress-wrap {
            display: none; flex-direction: column; gap: 6px;
        }
        #ai-progress-wrap.visible { display: flex; }
        #ai-progress-bar-track {
            height: 6px; background: var(--matcha-border-light); border-radius: 3px; overflow: hidden;
        }
        #ai-progress-bar-fill {
            height: 100%; width: 0%; background: var(--matcha-accent); border-radius: 3px;
            transition: width .3s ease;
        }
        #ai-progress-label {
            font-size: 11px; color: var(--matcha-text-muted);
        }
        #ai-prompt-area {
            display: flex; flex-direction: column; gap: 8px;
        }
        #ai-prompt-input {
            width: 100%; box-sizing: border-box;
            padding: 10px 12px; border: 1.5px solid var(--matcha-border); border-radius: 8px;
            font-size: 13px; font-family: inherit; background: var(--matcha-surface);
            color: var(--matcha-text); resize: vertical; min-height: 70px; outline: none;
            transition: border-color .18s;
        }
        #ai-prompt-input:focus { border-color: var(--matcha-accent); background: #fff; }
        #btn-ai-summarize {
            padding: 9px 14px; border: none; border-radius: 8px; font-size: 13px;
            font-weight: 600; cursor: pointer; background: var(--matcha-accent); color: white;
            font-family: inherit; transition: opacity .18s; display: flex; align-items: center;
            justify-content: center; gap: 6px;
        }
        #btn-ai-summarize:hover { opacity: .88; }
        #btn-ai-summarize:disabled { opacity: .5; cursor: not-allowed; }
        #ai-result-wrap {
            display: none; flex-direction: column; gap: 8px;
        }
        #ai-result-wrap.visible { display: flex; }
        #ai-result-label {
            font-size: 11px; font-weight: 600; color: var(--matcha-text-muted); letter-spacing: .5px; text-transform: uppercase;
        }
        #ai-result-box {
            background: var(--matcha-surface); border: 1px solid var(--matcha-border-light);
            border-radius: 8px; padding: 12px 14px;
            font-size: 13px; line-height: 1.75; color: var(--matcha-text);
            white-space: pre-wrap; word-break: break-word;
            max-height: 55vh; overflow-y: auto;
        }
        #ai-status-line {
            font-size: 11px; color: var(--matcha-text-muted); min-height: 16px;
        }
        #btn-ai-stop {
            display: none; padding: 7px 12px; border: 1px solid #c0483a; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer; color: #c0483a;
            background: none; font-family: inherit; transition: background .15s, color .15s;
        }
        #btn-ai-stop.visible { display: inline-flex; }
        #btn-ai-stop:hover { background: #c0483a; color: white; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<!-- AI 总结侧边面板 -->
<div id="ai-panel">
    <div id="ai-panel-header">
        <h3>AI 总结</h3>
        <span id="ai-backend-badge"></span>
        <button id="btn-close-ai" title="关闭">✕</button>
    </div>
    <div id="ai-panel-body">
        <div id="ai-model-bar">
            <select id="ai-model-select">
                <optgroup id="ai-optgroup-webgpu" label="WebGPU 模式（更快）">
                    <option value="webgpu:Qwen2.5-3B-Instruct-q4f16_1-MLC">Qwen2.5-3B（约2GB）</option>
                    <option value="webgpu:Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5-1.5B（约1GB）</option>
                    <option value="webgpu:SmolLM2-1.7B-Instruct-q4f16_1-MLC">SmolLM2-1.7B（英文）</option>
                </optgroup>
                <optgroup label="WASM 模式（全浏览器兼容）">
                    <option value="wasm:onnx-community/Qwen2.5-0.5B-Instruct">Qwen2.5-0.5B（约270MB）</option>
                    <option value="wasm:onnx-community/Qwen2.5-1.5B-Instruct">Qwen2.5-1.5B（约800MB）</option>
                    <option value="wasm:onnx-community/Qwen3-0.6B-ONNX">Qwen3-0.6B（约330MB）</option>
                </optgroup>
            </select>
        </div>
        <div id="ai-progress-wrap">
            <div id="ai-progress-bar-track"><div id="ai-progress-bar-fill"></div></div>
            <div id="ai-progress-label">准备中...</div>
        </div>
        <div id="ai-prompt-area">
            <textarea id="ai-prompt-input" placeholder="自定义提示词（可选，留空使用默认总结指令）"></textarea>
            <button id="btn-ai-summarize">读取文档并生成总结</button>
            <button id="btn-ai-stop">停止生成</button>
        </div>
        <div id="ai-status-line"></div>
        <div id="ai-result-wrap">
            <div id="ai-result-label">总结结果</div>
            <div id="ai-result-box"></div>
        </div>
    </div>
</div>

<div id="auth-overlay">
    <div class="auth-page">
        <div class="auth-logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM8 13h8v1.5H8V13zm0 3h8v1.5H8V16zm0-6h4v1.5H8V10z"/>
                </svg>
            </div>
            <h1>CoWrite</h1>
            <p>实时协作，随时随地</p>
        </div>
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">登录</button>
                <button class="auth-tab" id="tab-register" onclick="switchTab('register')">注册</button>
            </div>
            <div class="auth-form" id="form-login">
                <input type="text" id="input-username" placeholder="用户名" autocomplete="off">
                <input type="password" id="input-password" placeholder="密码">
                <button class="auth-submit" id="btn-login">登录</button>
            </div>
            <div class="auth-form" id="form-register" style="display:none;">
                <input type="text" id="input-username-reg" placeholder="用户名" autocomplete="off">
                <input type="password" id="input-password-reg" placeholder="密码">
                <button class="auth-submit" id="btn-register">注册账号</button>
            </div>
        </div>
    </div>
</div>

<div id="room-choice-overlay" class="flow-overlay">
    <div class="flow-page">
        <div class="flow-header">
            <h2>进入 CoWrite</h2>
            <p>创建或加入一个房间开始协作</p>
        </div>
        <div class="flow-card">
            <button class="flow-btn flow-btn-green" id="btn-create-room">创建新房间</button>
            <button class="flow-btn flow-btn-primary" id="btn-join-room">加入现有房间</button>
            <button class="flow-btn flow-btn-primary" id="btn-my-rooms">加入曾经加入过的房间</button>
            <div class="flow-divider"></div>
            <button class="flow-btn flow-btn-secondary" id="btn-go-back-login">返回登录</button>
        </div>
    </div>
</div>

<div id="room-name-overlay" class="flow-overlay">
    <div class="flow-page">
        <div class="flow-header">
            <h2>创建新房间</h2>
            <p>给你的协作空间起个名字</p>
        </div>
        <div class="flow-card">
            <input type="text" id="input-room-name" placeholder="房间名称" maxlength="30" autocomplete="off">
            <button class="flow-btn flow-btn-green" id="btn-confirm-room-name">下一步：设置邀请码</button>
            <button class="flow-btn flow-btn-secondary" id="btn-back-from-name">返回</button>
        </div>
    </div>
</div>

<div id="invite-type-overlay" class="flow-overlay">
    <div class="flow-page">
        <div class="flow-header">
            <h2>设置邀请码</h2>
            <p>选择邀请码的有效期类型</p>
        </div>
        <div class="flow-card">
            <button class="flow-btn flow-btn-secondary" id="btn-invite-once">一次性使用</button>
            <button class="flow-btn flow-btn-secondary" id="btn-invite-timed">限时有效</button>
            <div id="timed-options" style="display:none;">
                <select id="select-hours">
                    <option value="1">1 小时</option>
                    <option value="6">6 小时</option>
                    <option value="24" selected>24 小时</option>
                    <option value="72">3 天</option>
                    <option value="168">7 天</option>
                </select>
                <button class="flow-btn flow-btn-primary" id="btn-confirm-timed">确认创建</button>
            </div>
            <button class="flow-btn flow-btn-secondary" id="btn-invite-permanent">永久有效</button>
            <div class="flow-divider"></div>
            <button class="flow-btn flow-btn-secondary" id="btn-back-room-choice">返回</button>
        </div>
    </div>
</div>

<div id="room-created-overlay" class="flow-overlay">
    <div class="flow-page">
        <div class="flow-header">
            <h2>房间创建成功</h2>
            <p id="invite-type-hint">分享邀请码，邀请伙伴加入</p>
        </div>
        <div class="flow-card">
            <div id="invite-code-display">------</div>
            <button class="flow-btn flow-btn-primary" id="btn-copy-code">复制邀请码</button>
            <button class="flow-btn flow-btn-green" id="btn-enter-room">进入房间</button>
            <div class="flow-divider"></div>
            <button class="flow-btn flow-btn-secondary" id="btn-new-room">创建另一个房间</button>
        </div>
    </div>
</div>

<div id="join-room-overlay" class="flow-overlay">
    <div class="flow-page">
        <div class="flow-header">
            <h2>加入房间</h2>
            <p>输入 6 位邀请码</p>
        </div>
        <div class="flow-card">
            <input type="text" id="input-invite-code" placeholder="XXXXXX" maxlength="6">
            <button class="flow-btn flow-btn-primary" id="btn-join-with-code">加入房间</button>
            <div class="flow-divider"></div>
            <button class="flow-btn flow-btn-secondary" id="btn-back-choice">返回</button>
        </div>
    </div>
</div>

<div id="my-rooms-overlay" class="flow-overlay">
    <div class="flow-page" style="width:480px; max-width:96vw;">
        <div class="flow-header">
            <h2>我加入过的房间</h2>
            <p>点击任意房间直接进入</p>
        </div>
        <div class="flow-card">
            <p id="my-rooms-loading" class="flow-hint">加载中...</p>
            <div id="my-rooms-list" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;"></div>
            <div class="flow-divider"></div>
            <button class="flow-btn flow-btn-secondary" id="btn-back-from-my-rooms">返回</button>
        </div>
    </div>
</div>

<div id="gen-invite-overlay" class="flow-overlay">
    <div class="flow-page">
        <div class="flow-header">
            <h2>邀请码已生成</h2>
            <p id="gen-invite-type-hint">分享给需要加入的人</p>
        </div>
        <div class="flow-card">
            <div id="gen-invite-code-display">------</div>
            <button class="flow-btn flow-btn-primary" id="btn-copy-gen-code">复制邀请码</button>
            <div class="flow-divider"></div>
            <button class="flow-btn flow-btn-secondary" id="btn-close-gen-invite">关闭</button>
        </div>
    </div>
</div>

<div class="main-container">
    <div class="panel status-header">
        <div class="status-section status-section-brand">
            <span class="brand-name">CoWrite</span>
        </div>
        <div class="status-section status-section-doc">
            <span id="doc-display" style="color:var(--matcha-accent); font-weight:bold; font-size:13px;"></span>
            <button id="btn-rename-room" title="修改房间名" class="action-btn blue" style="display:none;">重命名</button>
            <button id="btn-gen-invite" class="action-btn orange" style="display:none;">邀请</button>
            <button id="btn-members" class="action-btn blue" style="display:none;">成员</button>
            <button id="btn-ai-panel" class="action-btn blue" style="display:none;">AI 总结</button>
            <button id="btn-leave-room" class="action-btn orange" style="display:none;">退出房间</button>
            <!-- 存档下拉 -->
            <div class="save-dropdown-wrap" id="save-dropdown-wrap">
                <button id="btn-save-menu">存档 ▾</button>
                <div class="save-dropdown-menu" id="save-dropdown-menu">
                    <div class="save-menu-item" id="menu-save">保存</div>
                    <div class="save-menu-item" id="menu-quicksave">快速保存</div>
                    <div class="save-menu-item" id="menu-load">读取</div>
                </div>
            </div>
            <div id="members-panel">
                <div class="members-panel-header">房间成员</div>
                <div class="members-list" id="members-list"><div class="member-item" style="color:#8a8a9a;">加载中...</div></div>
            </div>
        </div>
        <div class="status-section status-section-user">
            <span id="status" class="status-pill waiting">等待登录</span>
            <span id="site-display" class="status-pill" style="color:#666;">身份未确认</span>
            <button id="btn-logout">退出登录</button>
        </div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <div id="quill-toolbar" style="border-radius:8px 8px 0 0; border:1px solid var(--matcha-border); background:var(--matcha-surface); border-bottom:none;">
            <span class="ql-formats">
                <select class="ql-header"><option value="1"></option><option value="2"></option><option value=""></option></select>
            </span>
            <span class="ql-formats">
                <button class="ql-bold"></button>
                <button class="ql-italic"></button>
            </span>
            <span class="ql-formats">
                <select class="ql-color"></select>
            </span>
            <span class="ql-formats">
                <button class="ql-emoji"></button>
            </span>
        </div>
        <!-- 图形工具栏 -->
        <div id="shape-toolbar">
            <span class="stb-label">插入图形：</span>
            <!-- 矩形 -->
            <button class="shape-btn" id="stb-rect" title="矩形" onclick="selectShapeTool('rect')">
                <svg viewBox="0 0 20 20" fill="none" stroke="#3a3a4a" stroke-width="1.8">
                    <rect x="2" y="4" width="16" height="12" rx="1"/>
                </svg>
            </button>
            <!-- 圆形 -->
            <button class="shape-btn" id="stb-circle" title="圆形" onclick="selectShapeTool('circle')">
                <svg viewBox="0 0 20 20" fill="none" stroke="#3a3a4a" stroke-width="1.8">
                    <circle cx="10" cy="10" r="7"/>
                </svg>
            </button>
            <!-- 三角形 -->
            <button class="shape-btn" id="stb-triangle" title="三角形" onclick="selectShapeTool('triangle')">
                <svg viewBox="0 0 20 20" fill="none" stroke="#3a3a4a" stroke-width="1.8">
                    <polygon points="10,2 18,18 2,18"/>
                </svg>
            </button>
            <!-- 五角星 -->
            <button class="shape-btn" id="stb-star" title="五角星" onclick="selectShapeTool('star')">
                <svg viewBox="0 0 20 20" fill="none" stroke="#3a3a4a" stroke-width="1.8">
                    <polygon points="10,1 12.9,7 19.5,7.6 14.7,12 16.2,18.5 10,15 3.8,18.5 5.3,12 0.5,7.6 7.1,7"/>
                </svg>
            </button>
            <div class="stb-sep"></div>
            <!-- 取消 -->
            <button class="shape-btn" id="stb-cancel" title="取消/选择模式" onclick="cancelShapeTool()" style="display:none;">
                <svg viewBox="0 0 20 20" fill="none" stroke="#ff3b30" stroke-width="2">
                    <line x1="4" y1="4" x2="16" y2="16"/><line x1="16" y1="4" x2="4" y2="16"/>
                </svg>
            </button>
            <span id="shape-mode-hint" style="font-size:12px;color:var(--matcha-accent);display:none;"></span>
        </div>
        <!-- 编辑器+画布 -->
        <div id="editor-wrap">
            <div id="editor-container"></div>
            <canvas id="shape-canvas"></canvas>
            <div id="shape-hint"></div>
        </div>
    </div>

    <div id="log"></div>
</div>

<div id="load-save-overlay">
    <div class="load-save-modal">
        <div class="load-save-header">
            <h3>读取存档</h3>
            <button id="btn-close-load-save">✕</button>
        </div>
        <div class="load-save-list" id="load-save-list"></div>
    </div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill-cursors@3.1.0/dist/quill-cursors.min.js"></script>
<script src="https://unpkg.com/quill-emoji/dist/quill-emoji.js"></script>

<script src="js/helpers.js"></script>
<script src="js/toast.js"></script>
<script src="js/state.js"></script>
<script src="js/quill-setup.js"></script>
<script src="js/ws.js"></script>
<script src="js/auth.js"></script>
<script src="js/room-ui.js"></script>
<script src="js/shapes.js"></script>
<script src="js/text-wrap.js"></script>
<script src="js/snapshot.js"></script>
<script src="js/members.js"></script>
<script src="js/editor-events.js"></script>
<script src="js/messages.js"></script>
<script src="js/ai.js"></script>
<script type="module">
    window._loadWebLLM = async () => {
        if (window._webllm) return window._webllm;
        const webllm = await import("https://esm.run/@mlc-ai/web-llm");
        window._webllm = webllm;
        return webllm;
    };
</script>
</body>
</html>
